name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, openssl, pdo, pdo_sqlite, sodium
          coverage: none

      - name: Lint every PHP file
        run: php tools/lint.php

      - name: Run test suite
        run: php backend/tests/run.php

      - name: MCP server self-test
        run: php mcp/server.php --self-test

      - name: Check translation catalogs
        run: php tools/i18n-check.php

      - name: Secret scan
        run: php tools/secret-scan.php --repo=.

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Check no BOM / CRLF
        run: php tools/lint.php --text-files
