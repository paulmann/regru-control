# nginx: размещение панели в подкаталоге
#
# Это шаблон с плейсхолдерами, а не готовый файл: подставьте свой домен, путь,
# сокет PHP-FPM и список разрешённых сетей/адресов. Скрипт tools/deploy.ps1
# добавляет такой блок идемпотентно (по маркеру) в конфиг сайта.
#
# FastPanel/ISPmanager: собственные директивы держите в <домен>.includes —
# основной <домен>.conf панель перезаписывает.

# Редирект без слэша.
location = /<PREFIX> {
    return 301 /<PREFIX>/;
}

location ^~ /<PREFIX>/ {
    # Внутри хранятся пароли: доступ только доверенным сетям и адресам.
    allow <LAN_CIDR>;
    allow 127.0.0.1;
    allow <OWNER_IP>;
    deny all;

    index index.php;
    try_files $uri $uri/ /<PREFIX>/index.php?$query_string;

    # dotfiles (.env и прочее) наружу не отдаются.
    location ~ /<PREFIX>/\.(?!well-known/) {
        deny all;
    }

    # Исполняется только front controller.
    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:<PHP_FPM_SOCKET>;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}

# Исходники, конфигурация, база и документация — не для HTTP.
location ^~ /<PREFIX>/backend/  { deny all; }
location ^~ /<PREFIX>/frontend/ { deny all; }
location ^~ /<PREFIX>/var/      { deny all; }
location ^~ /<PREFIX>/docs/     { deny all; }

# Проверка после изменения:
#   nginx -t && systemctl reload nginx
#   curl -sk -o /dev/null -w '%{http_code}\n' https://<DOMAIN>/<PREFIX>/          # 200
#   curl -sk -o /dev/null -w '%{http_code}\n' https://<DOMAIN>/<PREFIX>/.env      # 403
#   curl -sk -o /dev/null -w '%{http_code}\n' https://<DOMAIN>/<PREFIX>/backend/bootstrap.php  # 403
